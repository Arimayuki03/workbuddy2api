services:
  wb2api:
    build: .
    container_name: workbuddy2api
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      # 容器内脚本（login.sh / checkin.sh）按此路径读配置——config 已改目录挂载，
      # cwd 下的 /app/config.json 只是镜像内 example 兜底，不含真实 api_key
      - WB2A_CONFIG=/app/config/config.json
    ports:
      - "7863:7863"
    volumes:
      # auths 凭证卷：login.sh 在宿主机落盘 workbuddy-<uid>.json（0600），容器网关以
      # app(uid 10001) 读 + 回写（refresh / realm backfill 走 tmp+rename，需目录写权限）。
      # 跨 uid 部署（非 root 宿主落盘 / rootful 下宿主 uid≠10001）读不到 → 账号数为 0
      # （issue #108）。登录后把目录属主交给 10001（与 ./data 卷同口径）：
      #   chown -R 10001:10001 ./auths
      # 之后新增账号建议进容器登录（app 自身落盘，属主即 10001，免反复 chown；容器内无
      # docker CLI，完成后回宿主机重启）：
      #   docker compose exec -it wb2api bash -c './login.sh' && docker compose restart wb2api
      - ./auths:/app/auths
      # data 保持 bind mount（本地映射，与旧版本一致）。
      # 若容器内 app(uid 10001) 写 state.json 报 permission denied，宿主机执行：
      #   chown -R 10001:10001 ./data
      - ./data:/app/data
      # config 必须挂「目录」而非单文件 bind mount：admin 热改写回 config 走
      # tmp+rename，单文件 bind mount 的目标是挂载点文件本身，rename 会被内核
      # EBUSY 拒绝（挂载点检查）——即使去掉 :ro 也一样，表现为响应 200 +
      # persisted:false + 容器内留新鲜 .bak、重启即回滚；目录内 rename 才可行。
      # 旧部署迁移（宿主机执行，与 ./auths、./data 卷同口径交属主）：
      #   mkdir config && mv config.json config/
      #   chown -R 10001:10001 ./config
      # 全新部署：本路径下镜像内 /app/config.json 的 example 兜底不再生效，
      # 先复制初始配置：
      #   cp config.example.json config/config.json
      - ./config:/app/config
    # 镜像 ENTRYPOINT 是 ["/app/wb2api", "-config", "/app/config.json"]，而 compose
    # 的 command 会追加到镜像 ENTRYPOINT 参数之后——只写 command 会出现
    # "-config /app/config.json -config /app/config/config.json" 双参。必须连
    # entrypoint 一起覆盖再指定新路径：
    entrypoint: ["/app/wb2api"]
    command: ["-config", "/app/config/config.json"]
